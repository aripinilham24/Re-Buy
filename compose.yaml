name: rebuy

# Local development infrastructure only.
# Containers are started manually and never auto-start with the app:
#   docker compose up -d
#   docker compose down
# No restart policy is set on purpose.

services:
  mongo:
    image: mongo:8.0
    container_name: rebuy-mongo
    restart: "no"
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 10

  minio:
    image: minio/minio:latest
    container_name: rebuy-minio
    restart: "no"
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-rebuy}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-rebuy12345}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data

  minio-init:
    image: minio/mc:latest
    container_name: rebuy-minio-init
    restart: "no"
    depends_on:
      minio:
        condition: service_started
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-rebuy}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-rebuy12345}
    entrypoint: >
      /bin/sh -c "
      until mc alias set local http://minio:9000 $$MINIO_ROOT_USER $$MINIO_ROOT_PASSWORD; do
        echo 'waiting for minio...';
        sleep 2;
      done;
      mc mb --ignore-existing local/rebuy;
      mc anonymous set download local/rebuy/products;
      echo 'minio bucket ready';
      exit 0;
      "

  mailpit:
    image: axllent/mailpit:latest
    container_name: rebuy-mailpit
    restart: "no"
    ports:
      - "1025:1025"
      - "8025:8025"

volumes:
  mongo_data:
  minio_data:
